name: dense_hmt
embed_dim: 64
depths: [1, 1, 1]          # blocks per encoder stage
window_size: 8             # windowed attention; set 0 = global attention at that stage
attn_stages: [false, true, true]   # attention branch only at coarser stages (12GB-friendly)
mamba_stages: [true, true, true]   # mamba branch at all stages
bidirectional_mamba: true
fusion: gate               # gate | concat  (concat = ablation)
num_heads: 4
mlp_ratio: 4.0
drop: 0.1
spectral_stem: linear   # linear | mlp | mamba
